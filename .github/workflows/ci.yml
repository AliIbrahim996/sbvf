name: CI

# Runs the Python test suites and the frontend build on every push to main and
# every pull request, so "done" can be verified automatically rather than by hand.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes, but never cancel a
# run on main: every merged commit should get a completed status.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python-tests:
    name: py ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The five unittest suites, run as modules exactly as the README documents
        # (python -m tests.<suite>). The core and the dashboard are stdlib-only, so
        # no pip install is needed: test_store skips without DATABASE_URL and
        # test_agents runs against an injected fake provider.
        suite:
          - test_framework
          - test_sast
          - test_store
          - test_agents
          - test_ui_server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ${{ matrix.suite }}
        run: python -m tests.${{ matrix.suite }}

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (type-checks the app)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
