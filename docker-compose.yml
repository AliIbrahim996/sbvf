# SBVF — backend API + Next.js dashboard, plus optional training targets.
#
#   docker compose up                  -> backend API  http://localhost:8080
#                                         Next.js UI    http://localhost:3000
#   docker compose --profile labs up   -> also starts DVWA (8081) and Juice Shop (3002)
#
# DVWA and Juice Shop are well-known deliberately-vulnerable training apps, used
# here only as extra local practice targets. They are NOT pointed at by the
# framework automatically (it is restricted to its own 127.0.0.1 benchmark apps);
# run manual experiments against them with --allow-remote only on your own machine.

services:
  sbvf:
    build: .
    image: sbvf:latest
    ports:
      - "8080:8080"
    environment:
      SBVF_UI_HOST: "0.0.0.0"
    # Mount the source over the image copy so code changes are picked up on a
    # container restart, without rebuilding the image. Remove these lines to run
    # the self-contained image as built.
    volumes:
      - ./sbvf:/app/sbvf:ro
      - ./ui:/app/ui:ro
      - ./testbed:/app/testbed:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: sbvf-frontend:latest
    ports:
      - "3000:3000"
    environment:
      # The Next.js route handler proxies /api/* to the backend. Inside the
      # compose network the backend is reachable by its service name.
      SBVF_API_ORIGIN: "http://sbvf:8080"
    depends_on:
      - sbvf
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa:latest
    profiles: ["labs"]
    ports:
      - "8081:80"
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles: ["labs"]
    ports:
      # Host 3002 — 3000 is taken by the SBVF frontend.
      - "3002:3000"
    restart: unless-stopped
