# SBVF — backend API + Next.js dashboard, plus optional training targets.
#
#   docker compose up                  -> backend API  http://localhost:8080
#                                         Next.js UI    http://localhost:3000
#   docker compose --profile labs up   -> also starts DVWA (8081) and Juice Shop (3002)
#
# DVWA and Juice Shop are well-known deliberately-vulnerable training apps, used
# here only as extra local practice targets. They are NOT pointed at by the
# framework automatically (it is restricted to its own 127.0.0.1 benchmark apps);
# run manual experiments against them with --allow-remote only on your own machine.

services:
  sbvf:
    build: .
    image: sbvf:latest
    ports:
      # Bind to the loopback interface only, so the API is not reachable from
      # other machines on the network. Expose it deliberately (and add auth) if
      # you need to; change this to "8080:8080" to publish on all interfaces.
      - "127.0.0.1:8080:8080"
    environment:
      SBVF_UI_HOST: "0.0.0.0"
      # The Next.js proxy reaches the backend as http://sbvf:8080, so allow that
      # Host header through the request guard (see ui/server.py `_guard`).
      SBVF_ALLOWED_HOSTS: "sbvf"
      # Persistence: point the backend at the postgres service. Remove this line
      # (or the db service) to run without persistence — scans still work.
      DATABASE_URL: "postgresql://sbvf:sbvf@db:5432/sbvf"
      # AI-agents layer (optional). Set one or more to enable triage, remediation
      # and prioritization on the scan-detail page. Absent → AI is simply off.
      # Values are read from your host environment; nothing is committed.
      # SBVF_AI_PROVIDER: "claude"            # force claude | openai | ollama
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # SBVF_AI_MODEL: "claude-3-5-sonnet-latest"
      # OLLAMA_URL: "http://host.docker.internal:11434"
    # Mount the source over the image copy so code changes are picked up on a
    # container restart, without rebuilding the image. Remove these lines to run
    # the self-contained image as built.
    volumes:
      - ./sbvf:/app/sbvf:ro
      - ./ui:/app/ui:ro
      - ./testbed:/app/testbed:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sbvf
      POSTGRES_PASSWORD: sbvf
      POSTGRES_DB: sbvf
    volumes:
      - sbvf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbvf -d sbvf"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: sbvf-frontend:latest
    ports:
      # Loopback only (see the backend note above).
      - "127.0.0.1:3000:3000"
    environment:
      # The Next.js route handler proxies /api/* to the backend. Inside the
      # compose network the backend is reachable by its service name.
      SBVF_API_ORIGIN: "http://sbvf:8080"
    depends_on:
      - sbvf
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa:latest
    profiles: ["labs"]
    ports:
      - "8081:80"
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles: ["labs"]
    ports:
      # Host 3002 — 3000 is taken by the SBVF frontend.
      - "3002:3000"
    restart: unless-stopped

volumes:
  sbvf-db:
